<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل دخول الطلاب</title>
    <script src="js/url.js"></script>
    <style>
        :root { --primary: #2c3e50; --accent: #3498db; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f6; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 2rem; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        .login-card h2 { color: var(--primary); margin-bottom: 1.5rem; }
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; transition: 0.3s; }
        button:hover { background: var(--accent); }
        .error-msg { color: #e74c3c; font-size: 14px; margin-top: 10px; display: none; }
        .loader { display: none; margin: 10px auto; border: 4px solid #f3f3f3; border-top: 4px solid var(--accent); border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="login-card">
    <img src="https://cdn-icons-png.flaticon.com/512/3135/3135810.png" width="80" alt="Logo">
    <h2>بوابة الطالب</h2>
    <form id="loginForm">
        <input type="email" id="email" placeholder="البريد الإلكتروني" required>
        <input type="password" id="password" placeholder="كلمة المرور" required>
        <button type="submit" id="loginBtn">دخول</button>
    </form>
    <div class="loader" id="loader"></div>
    <div class="error-msg" id="errorMsg"></div>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const btn = document.getElementById('loginBtn');
        const loader = document.getElementById('loader');
        const errorMsg = document.getElementById('errorMsg');

        // إظهار اللودر وإخفاء الخطأ
        btn.style.display = 'none';
        loader.style.display = 'block';
        errorMsg.style.display = 'none';

        // بناء الرابط لطلب تسجيل الدخول (GET كما هو محدد في السكربت الخاص بك)
        const loginUrl = `${WEB_APP_URL_Main}?action=loginStudent&email=${encodeURIComponent(email)}&password=${encodeURIComponent(password)}`;

        fetch(loginUrl)
            .then(response => response.json())
            .then(data => {
                if (data.result === "success") {
                    // حفظ بيانات الطالب في الـ LocalStorage لاستخدامها في بقية الصفحات
                    localStorage.setItem('studentData', JSON.stringify(data.data));
                    
                    // التوجيه لصفحة البوابة الرئيسية
                    window.location.href = "StudentPortal.html"; 
                } else {
                    throw new Error(data.message);
                }
            })
            .catch(err => {
                errorMsg.innerText = err.message || "حدث خطأ في الاتصال بالسيرفر";
                errorMsg.style.display = 'block';
                btn.style.display = 'block';
                loader.style.display = 'none';
            });
    });
</script>

</body>
</html>
