<!DOCTYPE html>
<html dir="rtl">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دخول الطلاب | منصة الأكاديمية</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Cairo', sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
    }
    .login-container {
      width: 100%;
      max-width: 400px;
      padding: 15px;
    }
    .card {
      border: none;
      border-radius: 25px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.1);
      overflow: hidden;
    }
    .card-header {
      background: #1e3c72;
      color: white;
      text-align: center;
      padding: 30px 20px;
      border: none;
    }
    .card-header i { font-size: 50px; margin-bottom: 10px; }
    .form-control {
      border-radius: 12px;
      padding: 12px;
      border: 1px solid #eee;
      background: #f9f9f9;
    }
    .form-control:focus {
      box-shadow: none;
      border-color: #1e3c72;
      background: #fff;
    }
    .btn-login {
      background: #1e3c72;
      color: white;
      border: none;
      border-radius: 12px;
      padding: 12px;
      width: 100%;
      font-weight: bold;
      transition: 0.3s;
    }
    .btn-login:hover { background: #2a5298; color: white; }
    .loader { display: none; }
    #errorMessage { font-size: 14px; margin-top: 10px; text-align: center; }
  </style>
</head>
<body>

<div class="login-container">
  <div class="card shadow-lg">
    <div class="card-header">
      <i class="fas fa-user-graduate"></i>
      <h4 class="mb-0">دخول الطالب</h4>
      <small>يرجى إدخال بياناتك للمتابعة</small>
    </div>
    <div class="card-body p-4">
      <div id="errorMessage"></div>
      
      <div class="mb-3">
        <label class="form-label">البريد الإلكتروني</label>
        <div class="input-group">
          <span class="input-group-text bg-white"><i class="fas fa-envelope text-muted"></i></span>
          <input type="email" id="userEmail" class="form-control" placeholder="example@mail.com">
        </div>
      </div>
      
      <div class="mb-4">
        <label class="form-label">كلمة المرور</label>
        <div class="input-group">
          <span class="input-group-text bg-white"><i class="fas fa-lock text-muted"></i></span>
          <input type="password" id="userPass" class="form-control" placeholder="••••••••">
        </div>
      </div>
      
      <button onclick="handleLogin()" id="loginBtn" class="btn btn-login">
        <span id="btnText">تسجيل الدخول</span>
        <div id="loader" class="spinner-border spinner-border-sm text-light ms-2 loader"></div>
      </button>
    </div>
  </div>
</div>

<script src="https://YOUR_GITHUB_OR_HOST_URL/url.js"></script>

<script>
  function handleLogin() {
    const email = document.getElementById('userEmail').value;
    const pass = document.getElementById('userPass').value;
    const btnText = document.getElementById('btnText');
    const loader = document.getElementById('loader');
    const errorBox = document.getElementById('errorMessage');

    if (!email || !pass) {
      showMsg("يرجى إدخال البريد وكلمة المرور", "danger");
      return;
    }

    // تجهيز حالة التحميل
    btnText.innerText = "جاري التحقق...";
    loader.style.display = "inline-block";
    errorBox.innerHTML = "";

    // استخدام الرابط من متغيرك العام WEB_APP_URL
    const apiUrl = `${WEB_APP_URL}?action=loginStudent&email=${encodeURIComponent(email)}&password=${encodeURIComponent(pass)}`;

    fetch(apiUrl)
      .then(response => response.json())
      .then(data => {
        if (data.result === "success") {
          showMsg("تم الدخول بنجاح، جاري التحويل...", "success");
          // حفظ بيانات الطالب في ذاكرة المتصفح
          localStorage.setItem('student_data', JSON.stringify(data.data));
          
          // الانتقال لصفحة البروفايل (portal) بعد ثانية واحدة
          setTimeout(() => {
            window.top.location.href = WEB_APP_URL + "?page=portal";
          }, 1000);
        } else {
          showMsg(data.message, "danger");
          resetBtn();
        }
      })
      .catch(error => {
        showMsg("خطأ في الاتصال بالسيرفر", "danger");
        resetBtn();
      });
  }

  function showMsg(msg, type) {
    const errorBox = document.getElementById('errorMessage');
    errorBox.innerHTML = `<div class="alert alert-${type} py-2">${msg}</div>`;
  }

  function resetBtn() {
    document.getElementById('btnText').innerText = "تسجيل الدخول";
    document.getElementById('loader').style.display = "none";
  }
</script>

</body>
</html>
