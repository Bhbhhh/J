<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل دخول الطلاب | منصة كن أنت</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="js/url.js"></script>
    <style>
        :root { 
            --primary: #1e3c72; 
            --accent: #f39c12; 
            --bg: #f4f7f6;
        }
        
        body { 
            font-family: 'Tajawal', sans-serif; 
            background: var(--bg); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
        }

        .login-card { 
            background: white; 
            padding: 2.5rem; 
            border-radius: 20px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.1); 
            width: 100%; 
            max-width: 400px; 
            text-align: center;
            border-top: 5px solid var(--primary);
        }

        .login-card img { 
            width: 100px; 
            margin-bottom: 1rem; 
        }

        .login-card h2 { 
            color: var(--primary); 
            margin-bottom: 0.5rem; 
            font-weight: 700;
        }

        .login-card p {
            color: #7f8c8d;
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }

        input { 
            width: 100%; 
            padding: 14px; 
            margin: 10px 0; 
            border: 1px solid #ddd; 
            border-radius: 12px; 
            box-sizing: border-box; 
            font-family: 'Tajawal', sans-serif;
            background: #f9f9f9;
            transition: 0.3s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 0 8px rgba(30, 60, 114, 0.1);
        }

        button { 
            width: 100%; 
            padding: 14px; 
            background: var(--primary); 
            color: white; 
            border: none; 
            border-radius: 12px; 
            cursor: pointer; 
            font-size: 16px; 
            font-weight: 600;
            font-family: 'Tajawal', sans-serif;
            transition: 0.3s; 
            margin-top: 10px;
        }

        button:hover { 
            background: #2a5298; 
            transform: translateY(-2px);
        }

        .error-msg { 
            color: #e74c3c; 
            font-size: 14px; 
            margin-top: 15px; 
            display: none; 
            background: #fdf2f2;
            padding: 10px;
            border-radius: 8px;
        }

        .loader { 
            display: none; 
            margin: 15px auto; 
            border: 3px solid #f3f3f3; 
            border-top: 3px solid var(--primary); 
            border-radius: 50%; 
            width: 25px; 
            height: 25px; 
            animation: spin 1s linear infinite; 
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="login-card">
    <img src="Logo/Logos.jpg" alt="منصة كن أنت">
    <h2>بوابة الطالب</h2>
    <p>أهلاً بك، سجل دخولك للمتابعة</p>
    
    <form id="loginForm">
        <input type="email" id="email" placeholder="البريد الإلكتروني" required>
        <input type="password" id="password" placeholder="كلمة المرور" required>
        <button type="submit" id="loginBtn">دخول للمنصة</button>
    </form>
    
    <div class="loader" id="loader"></div>
    <div class="error-msg" id="errorMsg"></div>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const btn = document.getElementById('loginBtn');
        const loader = document.getElementById('loader');
        const errorMsg = document.getElementById('errorMsg');

        btn.style.display = 'none';
        loader.style.display = 'block';
        errorMsg.style.display = 'none';

        const loginUrl = `${WEB_APP_URL_Main}?action=loginStudent&email=${encodeURIComponent(email)}&password=${encodeURIComponent(password)}`;

        fetch(loginUrl)
            .then(response => response.json())
            .then(data => {
                if (data.result === "success") {
                    // تخزين بيانات الطالب كما تم الاتفاق (اسم المفتاح مطابق للـ index)
                    const studentInfo = {
                        id: data.data.studentId,
                        name: data.data.nameAr,
                        level: data.data.level,
                        image: data.data.imageUrl
                    };
                    localStorage.setItem('student_session', JSON.stringify(studentInfo));
                    
                    // التوجيه لصفحة index.html
                    window.location.href = "index.html"; 
                } else {
                    throw new Error(data.message);
                }
            })
            .catch(err => {
                errorMsg.innerText = err.message || "حدث خطأ في الاتصال بالسيرفر";
                errorMsg.style.display = 'block';
                btn.style.display = 'block';
                loader.style.display = 'none';
            });
    });
</script>

</body>
</html>
